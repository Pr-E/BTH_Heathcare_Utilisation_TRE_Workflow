[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bth-active-blackpool-tre"
version = "0.4.0"
description = "TRE-ready Active Blackpool/BTH healthcare-utilisation evaluation workflow"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "PyYAML>=6.0",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "joblib>=1.4",
]

[tool.setuptools.packages.find]
where = ["src"]
