# =============================================================================
# Active Blackpool / BTH - REAL TRE analytical workflow configuration
# =============================================================================
# Real-data values that determine eligibility and interpretation must be supplied
# from the approved BTH/TRE source documentation before the affected stage runs.

project:
  name: active_blackpool_bth_tre

  # REQUIRED REAL-TRE INPUTS ---------------------------------------------------
  # These remain null until the approved coverage period for the linked BTH
  # extracts is confirmed.
  study_start_date: null
  study_end_date: null
  study_window_source: "REQUIRED: approved BTH/TRE extract coverage documentation"

  random_seed: 42

outputs:
  processed_dir: data/03_processed
  analysis_dir: data/04_analysis
  qa_dir: outputs/qa
  descriptive_dir: outputs/descriptive
  comparative_dir: outputs/comparative
  clustering_dir: outputs/clustering
  audit_dir: outputs/audit
  release_audit_dir: outputs/release_audit

cohort:
  # REAL SOURCE-BASED WORKING GROUPS -----------------------------------------
  # The real TRE source registry contains an MSK cohort explicitly labelled
  # without Sports and a separate Sports-linked MSK cohort. This confirms the
  # working pathway-group contrast below; it does NOT confirm Active Blackpool
  # programme start, attendance, completion or treatment exposure.
  working_exposure_label: "Sports-linked BTH pathway"
  working_comparison_label: "Wider MSK non-Sports-linked candidate"
  analysis_group_definition: "real TRE only_msk_sports vs msk_without_sports"
  analysis_group_semantics_confirmed_for_workflow: true
  analysis_group_semantics_note: >-
    The source files distinguish Sports-linked MSK pathway records from the wider
    MSK cohort without Sports. This supports pathway-group membership only.

  # CURRENT INDEX BOUNDARY -----------------------------------------------------
  # FirstMSKDate is available in the source tables, but its use as the final
  # analytical anchor requires source-owner confirmation. Keep this gate false
  # until that meaning has been confirmed in the TRE.
  analytical_index_semantics_confirmed_for_workflow: false

  # Programme-specific semantics remain unconfirmed. Sports Centre programme
  # start/attendance/completion or sustained activity data must not be inferred
  # from the MSK pathway tables.
  programme_exposure_semantics_confirmed: false
  programme_start_date_available: false
  index_is_programme_start: false
  final_real_data_index_semantics_confirmed: false

  index_strategy: "source_relative_first_msk"
  index_date_field: "AnchorFirstMSKDate"
  analytical_index_label: "Source-relative FirstMSKDate analytical index"

  baseline_days: 365
  followup_days: 365
  minimum_age: 16
  require_alive_at_index: true
  require_full_baseline: true
  # Retain partial follow-up and account for actual observed time using the
  # model offset. Do not require a complete 365-day follow-up for inclusion.
  require_full_followup: false

outcomes:
  # Inpatient outcome counting is at admission/spell level, not raw episode-row
  # level. Emergency admission coding must be rechecked against the real BTH
  # MethodOfAdmission values before final interpretation.
  inpatient_counting_unit: spell
  emergency_method_patterns:
    - "emergency"

propensity:
  # PRE-INDEX ONLY. No programme engagement, follow-up outcome, ExposureFlag or
  # cluster assignment is allowed into the propensity model.
  covariates:
    - AgeAtIndex
    - Sex
    - EthnicityNationalCodeDesc
    - Index_of_Multiple_Deprivation_IMD_Decile
    - PostcodeLAName
    - IndexYear
    - BaselineEDCount
    - BaselineInpatientCount
    - BaselineEmergencyInpatientCount

  # Structural positivity is assessed using the observed TRE data. The configured
  # minimum per group defines the eligibility rule; retained/excluded locations
  # and counts are always recalculated from the current extract.
  overlap_restrictions:
    - variable: PostcodeLAName
      min_per_group: 5

  balance_abs_smd_threshold: 0.10
  psm_ratio: 3
  caliper_sd_logit: 0.20
  require_full_psm_ratio: true
  random_seed: 42

comparative:
  outcomes:
    - FollowUpEDCount
    - FollowUpInpatientCount
    - FollowUpEmergencyInpatientCount
    - FollowUpTotalHospitalCount

  run_comparative_prepost_primary: true
  run_negative_binomial_sensitivity: true
  run_followup_adjusted_secondary: true
  run_psm_prepost_sensitivity: true
  run_psm_negative_binomial_sensitivity: false

  minimum_events_per_group: 5
  minimum_events_per_group_negative_binomial: 20

  # Do not continue to substantive primary-model interpretation when the real
  # data fail the prespecified ATT balance threshold.
  block_primary_models_if_att_balance_fails: true
  allow_unconfirmed_groups: false

